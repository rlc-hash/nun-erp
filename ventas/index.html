<!DOCTYPE html>
<html lang="es-MX">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>NUN CRM</title>
<meta name="theme-color" content="#F5F5F5">
<link rel="manifest" href="manifest.webmanifest?v=214">
<link rel="icon" href="icons/icon-192.png">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="NUN CRM">
<!--
  App de vendedores NUN v2.0 (3 nov 2026, decidido por Rafa) · v2.1 (4 nov): vive en /ventas/ con su propio alcance e ícono BLANCO
  (antes compartía el del ERP y el teléfono abría el ERP)
  · Cada vendedor ve solo lo suyo (el servidor lo filtra: Luis/Esteban sus clientes; Edgar a todos). Sin costos ni gastos.
  · Cotizar: sube COTIZACIONES (folio C…); Rafa o Yazmín las confirman y se vuelven pedido.
  · Registrar pago: queda "por verificar" (tabla pagosverificar); Rafa o Yazmín lo verifican en el sistema y ahí sí cuenta.
  · Inventario: solo existencias y precio de lista; nunca costos.
-->
<style>
:root{--bg:#f6f6f4;--card:#fff;--ink:#0a0a0a;--ink2:#3b3b3b;--mute:#8a8a8a;--line:#e6e6e3;--acc:#0a0a0a;--acc-ink:#fff;
  --ok:#1f8a4c;--ok-bg:#e8f6ee;--warn:#a35d00;--warn-bg:#fff4e0;--bad:#c0392b;--bad-bg:#fdecea;--blue:#1d5fbf;--blue-bg:#e9f0fc}
@media (prefers-color-scheme: dark){:root{--bg:#0b0b0c;--card:#16171a;--ink:#f3f3f3;--ink2:#cfcfcf;--mute:#8b8b90;--line:#2a2b30;--acc:#f3f3f3;--acc-ink:#0a0a0a;
  --ok:#4cc985;--ok-bg:#12291d;--warn:#f0a640;--warn-bg:#2b2111;--bad:#ff6b5e;--bad-bg:#2e1513;--blue:#7fb0ff;--blue-bg:#14213a}}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;background:var(--bg);color:var(--ink);font:15px/1.4 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Inter,sans-serif;overflow-x:hidden}
button,input,select,textarea{font:inherit;color:inherit}
.top{position:sticky;top:0;z-index:20;background:var(--bg);display:flex;align-items:center;gap:10px;padding:calc(10px + env(safe-area-inset-top)) 16px 10px;border-bottom:1px solid var(--line)}
.top img{width:34px;height:34px;border-radius:9px;cursor:pointer}
.top .t{flex:1;min-width:0}.top .t b{display:block;font-size:16px}.top .t span{font-size:12px;color:var(--mute)}
.ver{font:11px ui-monospace,Menlo,monospace;color:var(--mute);border:1px solid var(--line);border-radius:6px;padding:2px 6px}
main{padding:14px 16px calc(90px + env(safe-area-inset-bottom));max-width:720px;margin:0 auto}
.nav{position:fixed;left:0;right:0;bottom:0;z-index:30;background:var(--card);border-top:1px solid var(--line);display:flex;padding-bottom:env(safe-area-inset-bottom)}
.nav button{flex:1;min-width:0;border:0;background:none;padding:8px 0 9px;display:flex;flex-direction:column;align-items:center;gap:2px;font-size:10.5px;color:var(--mute)}
.nav button i{font-style:normal;font-size:20px;line-height:1}.nav button.on{color:var(--ink);font-weight:600}
h2{font-size:20px;margin:4px 0 12px}h3{font-size:15px;margin:18px 0 8px}
.card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:14px;margin-bottom:10px}
.kpis{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-bottom:6px}
.kpi{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:12px}
.kpi small{display:block;color:var(--mute);font-size:11.5px;text-transform:uppercase;letter-spacing:.04em}.kpi b{display:block;font-size:20px;margin-top:4px}.kpi span{font-size:12px;color:var(--mute)}
.row{display:flex;align-items:center;gap:10px;padding:12px 0;border-bottom:1px solid var(--line);cursor:pointer}.row:last-child{border-bottom:0}
.row .m{flex:1;min-width:0}.row .m b{display:block;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.row .m span{font-size:12.5px;color:var(--mute)}
.row .r{text-align:right;white-space:nowrap}.row .r b{display:block}.row .r span{font-size:12px;color:var(--mute)}
.tag{display:inline-block;font-size:11.5px;font-weight:600;border-radius:999px;padding:2px 8px;white-space:nowrap}
.t-ok{background:var(--ok-bg);color:var(--ok)}.t-warn{background:var(--warn-bg);color:var(--warn)}.t-bad{background:var(--bad-bg);color:var(--bad)}.t-blue{background:var(--blue-bg);color:var(--blue)}.t-mute{background:var(--line);color:var(--ink2)}
.btn{border:1px solid var(--line);background:var(--card);border-radius:12px;padding:11px 14px;font-weight:600;cursor:pointer}
.btn.p{background:var(--acc);color:var(--acc-ink);border-color:var(--acc)}.btn.w{width:100%}.btn:disabled{opacity:.5}
.btn.s{padding:7px 11px;font-size:13px;border-radius:10px}a.btn{color:inherit;text-decoration:none}
.in{width:100%;border:1px solid var(--line);background:var(--card);border-radius:12px;padding:11px 12px;font-size:16px}
label.l{display:block;font-size:12.5px;color:var(--mute);margin:12px 0 5px}
.chips{display:flex;gap:6px;overflow-x:auto;padding-bottom:4px;margin-bottom:8px}.chips button{border:1px solid var(--line);background:var(--card);border-radius:999px;padding:6px 12px;font-size:13px;white-space:nowrap}
.chips button.on{background:var(--acc);color:var(--acc-ink);border-color:var(--acc)}
.vacio{text-align:center;color:var(--mute);padding:28px 10px}
.hoja{position:fixed;inset:0;z-index:50;background:rgba(0,0,0,.45);display:flex;align-items:flex-end}
.hoja>div{background:var(--bg);width:100%;max-height:92vh;overflow:auto;border-radius:18px 18px 0 0;padding:16px 16px calc(20px + env(safe-area-inset-bottom))}
.hoja .cab{display:flex;align-items:center;gap:10px;margin-bottom:8px}.hoja .cab b{flex:1;font-size:17px}
.x{border:0;background:var(--line);border-radius:999px;width:32px;height:32px;font-size:16px}
.linea{padding:10px 0;border-bottom:1px solid var(--line)}.linea small{color:var(--mute)}
.linea .li{display:grid;grid-template-columns:80px 1fr 36px;gap:8px;align-items:end;margin-top:6px}.linea .li label{font-size:11.5px;color:var(--mute)}.linea .in{padding:8px;font-size:16px;margin-top:2px}
.tot{display:flex;justify-content:space-between;padding:4px 0}.tot.g{font-size:18px;font-weight:700}
.toast{position:fixed;left:16px;right:16px;bottom:calc(80px + env(safe-area-inset-bottom));z-index:80;background:var(--ink);color:var(--bg);border-radius:12px;padding:12px 14px;font-weight:600;box-shadow:0 10px 30px rgba(0,0,0,.25)}
.toast.err{background:var(--bad);color:#fff}
.login{min-height:100vh;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:24px}
.login img{width:84px;height:84px;border-radius:20px;margin-bottom:14px}.login h1{margin:0 0 4px;font-size:24px}.login p{color:var(--mute);margin:0 0 22px}
.login .in{text-align:center;letter-spacing:.06em;max-width:340px}.login .btn{max-width:340px;margin-top:10px}
.err{color:var(--bad);margin-top:12px;text-align:center;max-width:340px}
.sub{color:var(--mute);font-size:12.5px}
.sw{display:flex;align-items:center;gap:8px;margin-top:10px}.sw input{width:20px;height:20px}
.res{max-height:240px;overflow:auto;border:1px solid var(--line);border-radius:12px;background:var(--card);margin-top:6px}
.res div{padding:10px 12px;border-bottom:1px solid var(--line);cursor:pointer}.res div:last-child{border-bottom:0}
.aviso{background:var(--warn-bg);color:var(--warn);border-radius:12px;padding:10px 12px;font-size:13.5px;margin-bottom:10px}
</style>
</head>
<body>
<div id="app"></div>
<script src="../nun-pdf.js?v=2.1.5"></script>
<script>
// ============================================================
// NUN Vendedores v2.0
// ============================================================
const VERSION = 'v2.1.16';
const URL_API = 'https://vlqbzfotjltarelwenvu.supabase.co/functions/v1/nun';
const K_SES = 'nunv_sesion', K_CACHE = 'nunv_cache_', K_DEV = 'nunv_device';
const TABLAS = ['clientes','productos','cotizaciones','pedidos','facturas','remisiones','cobranza','ingresos','pagosverificar'];
const VENDEDORES = ['EDGAR','LUIS','ESTEBAN','YADAH'];
const PCT_COMISION = { EDGAR: 0.06, LUIS: 0.05, ESTEBAN: 0.05 }; // lo propio; Rafa confirma al cierre
const S = { ses: null, d: {}, tab: 'inicio', cargando: false, verComo: '', filtroPed: 'todo', soloMios: true, cuentas: [] };
TABLAS.forEach(t => S.d[t] = []);
// v2.0.2 — PDF igual al del ERP (nun-pdf.js): lo que esa hoja espera encontrar
var State = { data: S.d };
const escapeHTML = s => esc(s);
const fmtFull = n => '$' + (Number(n) || 0).toLocaleString('en-US', { minimumFractionDigits: 2, maximumFractionDigits: 2 });
function nunR2(x){ return Math.round((+x || 0) * 100 + (x >= 0 ? 1e-9 : -1e-9)) / 100; }
function nunEsVerdad(v){ return v === true || v === 1 || /^(true|1|s[ií]|yes|x)$/i.test(String(v == null ? '' : v).trim()); }
function nunCalcLinea(it, sinIva){ const bruto = nunR2((+it.cantidad||0) * (+it.precio_unitario||0)); const desc = nunR2(bruto * (+it.descuento_pct||0) / 100); const base = nunR2(bruto - desc);
  const pct = sinIva ? 0 : (+it.iva_pct||0); const iva = nunR2(base * pct / 100); return { bruto, desc, base, pct, iva, total: nunR2(base + iva) }; }
function nunCalcDoc(items, sinIva){ let sub = 0, iva = 0; (items||[]).forEach(it => { const c = nunCalcLinea(it, sinIva); sub += c.base; iva += c.iva; }); sub = nunR2(sub); iva = nunR2(iva); return { subtotal: sub, iva, total: nunR2(sub + iva) }; }
function nunSaldoDoc(doc, tabla){ const c = typeof cobroDeDoc === 'function' ? cobroDeDoc(tabla, doc) : null; return c ? Math.max(0, +c.pendiente || 0) : 0; }
function cfdiGetStore(){ return {}; }
// v2.1.5 — XML de la factura (del servidor): da el QR del SAT y los sellos en el PDF, y se puede descargar
const _xml = {};
async function xmlDe(uuid){
  const u = String(uuid || ''); if (!u) return '';
  if (_xml[u]) return _xml[u];
  for (const x of [u, u.toUpperCase(), u.toLowerCase()]) {
    try { const r = await api({ accion: 'cfdi_xml_get', uuid: x }); if (r && r.ok && r.xml) { _xml[u] = r.xml; break; } } catch(e){}
  }
  if (_xml[u] && typeof cfdiTimbreData === 'function') { const tm = cfdiGetTimbres(); if (!tm[u]) { const td = cfdiTimbreData(_xml[u]); if (td) { tm[u] = td; cfdiSetTimbres(tm); } } }
  return _xml[u] || '';
}
async function pdfDoc(tabla, id){
  if (typeof imprimirDocumento !== 'function') { toast('No se pudo cargar el PDF; revisa tu conexión', true); return; }
  if (!S.d.empresa) toast('Cargando datos de la empresa…');
  const d = (S.d[tabla] || []).find(x => String(x.id) === String(id));
  if (tabla === 'facturas' && d && d.uuid_sat && !cfdiGetTimbres()[d.uuid_sat]) { toast('Cargando el timbre del SAT…'); await xmlDe(d.uuid_sat); }
  imprimirDocumento(tabla, id);
}
async function xmlDoc(uuid, folio){
  toast('Bajando XML…');
  const x = await xmlDe(uuid);
  if (!x) { toast('No encontré el XML de esta factura en el servidor', true); return; }
  // v2.1.7: se baja al teléfono (Chrome en Android no deja compartir archivos .xml: da "Permission denied")
  bajar(new File([x], 'Factura_' + String(folio || uuid).replace(/[^\w-]/g, '') + '.xml', { type: 'application/xml' }));
  toast('XML guardado en Descargas');
}
function bajar(f){ const a = document.createElement('a'); a.href = URL.createObjectURL(f); a.download = f.name; document.body.appendChild(a); a.click(); setTimeout(() => { URL.revokeObjectURL(a.href); a.remove(); }, 4000); }

// ---------- utilidades ----------
const $ = id => document.getElementById(id);
const esc = s => String(s == null ? '' : s).replace(/[&<>"']/g, c => ({ '&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;' }[c]));
const r2 = x => Math.round((+x || 0) * 100 + (x >= 0 ? 1e-9 : -1e-9)) / 100;
const $$ = n => '$' + (+n || 0).toLocaleString('es-MX', { minimumFractionDigits: 2, maximumFractionDigits: 2 });
const $0 = n => '$' + Math.round(+n || 0).toLocaleString('es-MX');
const norm = s => String(s || '').normalize('NFD').replace(/[̀-ͯ]/g, '').toUpperCase().replace(/S\.?\s*A\.?\s*DE\s*C\.?\s*V\.?/g, '').replace(/[^A-Z0-9]/g, '');
const MESES = ['ene','feb','mar','abr','may','jun','jul','ago','sep','oct','nov','dic'];
function fecha10(f){ const s = String(f || ''); if (/^\d{4}-\d{2}-\d{2}T/.test(s)) { const d = new Date(s); if (!isNaN(d)) return d.getFullYear() + '-' + String(d.getMonth()+1).padStart(2,'0') + '-' + String(d.getDate()).padStart(2,'0'); } return s.slice(0, 10); }
function fmtF(f){ const s = fecha10(f); const m = s.match(/^(\d{4})-(\d{2})-(\d{2})/); return m ? (+m[3]) + ' ' + MESES[+m[2]-1] + ' ' + m[1].slice(2) : (s || '—'); }
function hoy(){ const d = new Date(); return d.getFullYear() + '-' + String(d.getMonth()+1).padStart(2,'0') + '-' + String(d.getDate()).padStart(2,'0'); }
const mesActual = () => hoy().slice(0, 7);
function calcDoc(items, sinIva){ let sub = 0, iva = 0; items.forEach(it => { const base = r2(r2((+it.cantidad||0) * (+it.precio_unitario||0))); sub += base; iva += sinIva ? 0 : r2(base * 0.16); }); sub = r2(sub); iva = r2(iva); return { subtotal: sub, iva, total: r2(sub + iva) }; }
function lsGet(k, def){ try { const v = localStorage.getItem(k); return v ? JSON.parse(v) : def; } catch(e){ return def; } }
function lsSet(k, v){ try { localStorage.setItem(k, JSON.stringify(v)); } catch(e){} }
function toast(msg, err){ const t = document.createElement('div'); t.className = 'toast' + (err ? ' err' : ''); t.textContent = msg; document.body.appendChild(t); setTimeout(() => t.remove(), err ? 6000 : 3200); }
function device(){ let d = lsGet(K_DEV, ''); if (!d) { d = 'v_' + Date.now().toString(36) + Math.random().toString(36).slice(2, 8); lsSet(K_DEV, d); } return d; }

async function api(body, ms){
  const b = Object.assign({}, body, { codigo: S.ses && S.ses.codigo });
  const ctl = typeof AbortController === 'function' ? new AbortController() : null; const t = ctl && ms ? setTimeout(() => ctl.abort(), ms) : null; // v2.0.1 nunca esperar para siempre
  let j;
  try { const r = await fetch(URL_API, { method: 'POST', body: JSON.stringify(b), headers: { 'Content-Type': 'text/plain;charset=utf-8' }, signal: ctl ? ctl.signal : undefined }); j = await r.json(); }
  finally { if (t) clearTimeout(t); }
  if (j && j.requiere_login) { salir('Vuelve a entrar con tu código'); throw new Error('Vuelve a entrar con tu código'); }
  return j;
}

// ---------- sesión ----------
const esVendedor = () => !!S.ses && String(S.ses.usuario && S.ses.usuario.rol || '').toLowerCase() === 'vendedor';
function miVendedor(){ if (!S.ses) return ''; if (!esVendedor()) return S.verComo; return norm((S.ses.usuario && S.ses.usuario.vendedor_asignado) || (S.ses.usuario && S.ses.usuario.nombre)); }
const puedeCotizar = () => !!S.ses && (!esVendedor() || (!!(S.ses.permisos || {}).agregar_pedidos && !(S.ses.permisos || {}).solo_consulta));
const veTodos = () => !!S.ses && (!esVendedor() || !!(S.ses.permisos || {}).ver_todos_clientes);

function pintarLogin(err){
  document.getElementById('app').innerHTML = `<div class="login">
    <img src="icons/icon-192.png" alt="NUN"><h1>NUN CRM</h1><p>Escribe tu código de acceso</p>
    <input id="lgCod" class="in" placeholder="TU-CÓDIGO" autocomplete="off" autocapitalize="characters" spellcheck="false" onkeydown="if(event.key==='Enter')entrar()">
    <button class="btn p w" id="lgBtn" onclick="entrar()">Entrar</button>
    <div class="err" id="lgErr">${esc(err || '')}</div>
    <div class="sub" style="margin-top:28px">${VERSION}</div></div>`;
}
async function entrar(){
  const c = $('lgCod').value.trim().toUpperCase(); if (!c) { $('lgErr').textContent = 'Escribe tu código'; return; }
  $('lgBtn').disabled = true; $('lgBtn').textContent = 'Entrando…'; $('lgErr').textContent = '';
  try {
    const r = await fetch(URL_API, { method: 'POST', body: JSON.stringify({ accion: 'login', codigo: c, device_id: device(), device_name: 'App vendedores · ' + (navigator.userAgent.match(/\(([^;)]+)/) || [,'teléfono'])[1] }), headers: { 'Content-Type': 'text/plain;charset=utf-8' } });
    const j = await r.json();
    if (!j.ok) { $('lgErr').textContent = j.error || 'Código inválido'; $('lgBtn').disabled = false; $('lgBtn').textContent = 'Entrar'; return; }
    S.ses = { codigo: c, usuario: j.usuario || {}, permisos: (j.permisos && typeof j.permisos === 'object') ? j.permisos : {} };
    lsSet(K_SES, S.ses); arrancar();
  } catch(e){ $('lgErr').textContent = 'Sin conexión: ' + e.message; $('lgBtn').disabled = false; $('lgBtn').textContent = 'Entrar'; }
}
function salir(msg){ S.ses = null; try { localStorage.removeItem(K_SES); TABLAS.forEach(t => localStorage.removeItem(K_CACHE + t)); } catch(e){} pintarLogin(msg); }

// ---------- datos ----------
async function cargar(silencio){
  if (S.cargando) return; S.cargando = true; pintarTop();
  // v2.0.1 — de 3 en 3 (todas juntas trababan el servidor), cada una con límite de tiempo y un reintento; se pinta conforme llega
  let fallo = 0; const cola = TABLAS.slice();
  const una = async t => {
    for (let i = 0; i < 2; i++) {
      try { const j = await api({ accion: 'erp_listar', tabla: t }, 40000); if (j.ok) { S.d[t] = j.items || []; lsSet(K_CACHE + t, S.d[t]); if (S.tab !== 'cotizar') { try { pintar(); } catch(e){} } else if (t === 'productos') { try { buscarProd(); } catch(e){} } return; } }
      catch(e){ if (/Vuelve a entrar/.test(e.message)) throw e; }
    }
    if (t !== 'pagosverificar') fallo++;
  };
  await Promise.all([0, 1, 2].map(async () => { while (cola.length) await una(cola.shift()); }));
  try { const e = await api({ accion: 'obtener_empresa' }, 30000); if (e && e.ok) { S.d.empresa = e.config || {}; lsSet(K_CACHE + 'empresa', S.d.empresa); } } catch(e){}
  try { const c = await api({ accion: 'listar_cuentas' }); if (c.ok) S.cuentas = (c.cuentas || []).filter(x => x.activa !== false && x.activa !== 'false').map(x => x.nombre); } catch(e){}
  S.cargando = false; S.hora = new Date();
  if (fallo && !silencio) toast('No se pudo actualizar todo; se muestra lo último guardado', true);
  pintar();
}
const vivo = d => !/cancel|duplicad/i.test(String(d && d.estatus || ''));
function ingresosValidos(){
  const a = S.d.ingresos || [];
  return a.filter(i => !/^(CANCELADO|DUPLICADO)/i.test(String(i.tipo || '')) && !esPrueba(i.cliente)); // v2.1.11: igual que el ERP v4.73 (cuentan todos los pagos vivos; los repetidos ya están marcados)
}
// ¿es de este vendedor? (si ve a todos y escogió "solo míos")
function clientesDe(v){ return new Set((S.d.clientes || []).filter(c => norm(c.vendedor) === v).map(c => norm(c.razon_social))); }
function esMio(doc, set){ const v = miVendedor(); if (!v) return true; return norm(doc.vendedor) === v || set.has(norm(doc.cliente)); }
function filtroMios(arr){ if (!S.soloMios && veTodos()) return arr; const v = miVendedor(); if (!v) return arr; const set = clientesDe(v); return arr.filter(d => esMio(d, set)); }
function misClientes(){ const v = miVendedor(); const cl = S.d.clientes || []; if (!v || (!S.soloMios && veTodos())) return cl; return cl.filter(c => norm(c.vendedor) === v); }
const esPrueba = n => /LANIADO/i.test(String(n || '')); // v2.1.12 cliente de PRUEBA (RAFAEL LANIADO CATTAN): no suma en cobrado, te deben ni comisión
const cobrosVivos = () => (S.d.cobranza || []).filter(c => vivo(c) && !esPrueba(c.cliente));
const porVerificar = () => (S.d.pagosverificar || []).filter(p => p.estatus === 'por_verificar');
function verificandoDe(cobroId){ return r2(porVerificar().filter(p => String(p.cobro_id) === String(cobroId)).reduce((a, p) => a + (+p.monto || 0), 0)); }
function cobroDePedido(p){ const c = S.d.cobranza || []; return c.find(x => String(x.factura_origen) === String(p.id) || x.id === 'cob_' + p.id) || null; }
// cobros del pedido: el suyo y los de sus remisiones/facturas (los pedidos viejos se cobran en la remisión)
function cobrosDePedido(p){
  const cob = S.d.cobranza || [], f = String(p.folio || '').trim(), out = [];
  const add = c => { if (c && vivo(c) && !out.includes(c)) out.push(c); };
  add(cobroDePedido(p));
  ['remisiones', 'facturas'].forEach(t => (S.d[t] || []).filter(d => vivo(d) && String(d.pedido_origen || '').split(',').map(x => x.trim()).includes(f)).forEach(d => {
    const bid = String(d.id).replace(/^bind_(rem_|fac_)?/, '');
    add(cob.find(x => String(x.factura_origen) === String(d.id) || x.id === 'cob_' + d.id || x.id === 'bind_cob_' + bid));
  }));
  return out;
}

// ---------- pantallas ----------
function pintarTop(){
  const t = $('topSub'); if (t) t.textContent = S.cargando ? 'Actualizando…' : ('Actualizado ' + (S.hora ? S.hora.toLocaleTimeString('es-MX', { hour: '2-digit', minute: '2-digit' }) : '—'));
}
function marco(){

  <div class="top"><img src="icons/icon-192.png" alt="NUN" onclick="cargar()" title="Actualizar">

function selectorVendedor(){
  if (esVendedor()) return veTodos() ? `<div class="chips"><button class="${S.soloMios ? 'on' : ''}" onclick="S.soloMios=true;pintar()">Lo mío</button><button class="${!S.soloMios ? 'on' : ''}" onclick="S.soloMios=false;pintar()">Todos</button></div>` : '';
  return `<div class="chips"><button class="${!S.verComo ? 'on' : ''}" onclick="S.verComo='';pintar()">Todos</button>${VENDEDORES.map(v => `<button class="${S.verComo === v ? 'on' : ''}" onclick="S.verComo='${v}';pintar()">${v}</button>`).join('')}</div>`;
}

function vInicio(){
  const v = miVendedor(), mes = mesActual();
  const pedidos = filtroMios((S.d.pedidos || []).filter(p => vivo(p) && !/borrador/i.test(p.estatus || '') && !esPrueba(p.cliente)));
  const vendidoMes = pedidos.filter(p => fecha10(p.fecha).slice(0, 7) === mes).reduce((a, p) => a + (+p.total || 0), 0);
  const cobros = filtroMios(cobrosVivos());
  const debe = cobros.reduce((a, c) => a + ((+c.pendiente || 0) >= 1 ? +c.pendiente : 0), 0);
  const numsMios = new Set(cobros.map(c => String(c.numero).trim()));
  const ingMes = ingresosValidos().filter(i => fecha10(i.fecha).slice(0, 7) === mes && numsMios.has(String(i.factura).trim()));
  const cobradoMes = ingMes.reduce((a, i) => a + (+i.monto || 0), 0);
  const pct = PCT_COMISION[v] || 0;
  const cots = filtroMios((S.d.cotizaciones || []).filter(c => c.estatus === 'enviada'));
  const pv = filtroMios(porVerificar());
  const vencidos = cobros.filter(c => (+c.pendiente || 0) >= 1).sort((a, b) => (+b.pendiente) - (+a.pendiente)).slice(0, 5);
  return `${selectorVendedor()}<h2>Hola${(S.ses.usuario || {}).nombre ? ', ' + esc(S.ses.usuario.nombre) : ''}</h2>
  <div class="kpis">
    <div class="kpi"><small>Vendido en ${MESES[+mes.slice(5) - 1]}</small><b>${$0(vendidoMes)}</b><span>${pedidos.filter(p => fecha10(p.fecha).slice(0, 7) === mes).length} pedidos</span></div>
    <div class="kpi" style="cursor:pointer" onclick="ir('pagos')"><small>Cobrado en ${MESES[+mes.slice(5) - 1]} ›</small><b>${$0(cobradoMes)}</b><span>${ingMes.length} pagos</span></div>
    <div class="kpi" style="cursor:pointer" onclick="S.filtroCob='saldo';ir('cobranza')"><small>Te deben ›</small><b>${$0(debe)}</b><span>${cobros.filter(c => (+c.pendiente || 0) >= 1).length} documentos</span></div>
    <div class="kpi" style="cursor:pointer" onclick="ir('pagos')"><small>Comisión aprox. ›</small><b>${pct ? $0(cobradoMes * pct) : '—'}</b><span>${pct ? Math.round(pct * 100) + '% de lo cobrado' : (v ? 'la calcula Rafa' : 'elige vendedor')}</span></div>
  </div>
  <div class="sub" style="margin:2px 0 10px">La comisión es aproximada; Rafa la confirma al cierre del mes.</div>
  ${puedeCotizar() ? '<button class="btn p w" onclick="ir(\'cotizar\')">➕ Nueva cotización</button>' : ''}
  ${pv.length ? `<h3>Pagos por verificar (${pv.length})</h3><div class="card">${pv.map(p => `<div class="row" style="cursor:default"><div class="m"><b>${esc(p.cliente)}</b><span>${esc(p.documento || '')} · ${fmtF(p.fecha)} · ${esc(p.cuenta || '')}</span></div><div class="r"><b>${$$(p.monto)}</b><span class="tag t-warn">por verificar</span></div></div>`).join('')}</div>` : ''}
  <h3>Cotizaciones por confirmar (${cots.length})</h3>
  <div class="card">${cots.length ? cots.slice(0, 8).map(c => filaCot(c)).join('') : '<div class="vacio">Ninguna pendiente</div>'}</div>
  <h3>Quién te debe más</h3>
  <div class="card">${vencidos.length ? vencidos.map(c => `<div class="row" onclick="abrirCliente(${esc(JSON.stringify(c.cliente))})"><div class="m"><b>${esc(c.cliente)}</b><span>${esc(c.tipo || '')} ${esc(c.numero)} · ${fmtF(c.fecha_emision)}</span></div><div class="r"><b>${$$(c.pendiente)}</b>${verificandoDe(c.id) ? '<span class="tag t-warn">por verificar</span>' : ''}</div></div>`).join('') : '<div class="vacio">Nadie te debe 🎉</div>'}</div>`;
}

function estadoCot(c){
  if (c.estatus === 'enviada') return '<span class="tag t-warn">por confirmar</span>';
  if (c.estatus === 'convertida') { const p = (S.d.pedidos || []).find(x => String(x.cotizacion_origen) === String(c.folio) || String(x.cotizacion_origen) === String(c.id)); return '<span class="tag t-ok">confirmada' + (p ? ' · ' + esc(p.folio) : '') + '</span>'; }
  if (/cancel/i.test(c.estatus || '')) return '<span class="tag t-mute">cancelada</span>';
  return '<span class="tag t-mute">' + esc(c.estatus || '') + '</span>';
}
function filaCot(c){ return `<div class="row" onclick="abrirDoc('cotizaciones','${esc(c.id)}')"><div class="m"><b>${esc(c.cliente)}</b><span>${esc(c.folio)} · ${fmtF(c.fecha)}${c.creado_por ? ' · subió ' + esc(c.creado_por) : ''}</span></div><div class="r"><b>${$$(c.total)}</b>${estadoCot(c)}</div></div>`; }
function estadoPed(p){
  if (/cancel/i.test(p.estatus || '')) return '<span class="tag t-mute">cancelado</span>';
  const cs = cobrosDePedido(p), debe = cs.reduce((a, c) => a + ((+c.pendiente || 0) >= 1 ? +c.pendiente : 0), 0);
  if (cs.length && debe < 1) return '<span class="tag t-ok">pagado</span>';
  const e = String(p.estatus || '').toLowerCase();
  return '<span class="tag ' + (e === 'facturado' || e === 'entregado' ? 't-blue' : 't-warn') + '">' + esc(e || 'pedido') + '</span>' + (debe >= 1 ? '<span style="display:block;font-size:12px;color:var(--mute)">debe ' + $0(debe) + '</span>' : '');
}
// v2.0.1 — facturas y remisiones (como en la app anterior): su cobro y su estado
function cobroDeDoc(tabla, d){
  const cob = S.d.cobranza || [], bid = String(d.id).replace(/^bind_(rem_|fac_)?/, ''), f = String(d.folio || '').trim();
  return cob.find(x => vivo(x) && (String(x.factura_origen) === String(d.id) || x.id === 'cob_' + d.id || x.id === 'bind_cob_' + bid))
    || cob.find(x => vivo(x) && norm(x.cliente) === norm(d.cliente) && (String(x.numero).trim() === f || String(x.numero).trim() === 'V01' + f)) || null;
}
function estadoDoc(tabla, d){
  if (/cancel/i.test(d.estatus || '')) return '<span class="tag t-mute">cancelada</span>';
  const c = cobroDeDoc(tabla, d);
  const base = tabla === 'facturas' ? (d.uuid_sat || d.estatus === 'timbrada' ? 'timbrada' : (d.estatus || 'borrador')) : (d.estatus || 'remisión');
  if (c && (+c.pendiente || 0) < 1) return '<span class="tag t-ok">pagada</span>';
  return '<span class="tag t-blue">' + esc(base) + '</span>' + (c && (+c.pendiente || 0) >= 1 ? '<span style="display:block;font-size:12px;color:var(--mute)">debe ' + $0(c.pendiente) + '</span>' : '');
}
function filaDoc(tabla, d){ return `<div class="row" onclick="abrirDoc('${tabla}','${esc(d.id)}')"><div class="m"><b>${esc(d.cliente)}</b><span>${tabla === 'facturas' ? 'Factura' : 'Remisión'} ${esc(d.folio)} · ${fmtF(d.fecha)}</span></div><div class="r"><b>${$$(d.total)}</b>${estadoDoc(tabla, d)}</div></div>`; }

// v2.0.1 — Cobranza (como la pestaña de la app anterior): lo que le deben, vencidos, pagados
function vCobranza(){
  const f = S.filtroCob || 'saldo', q = norm(S.qCob || '');
  let l = filtroMios(cobrosVivos());
  if (f === 'saldo') l = l.filter(c => (+c.pendiente || 0) >= 1);
  else if (f === 'venc') l = l.filter(c => (+c.pendiente || 0) >= 1 && (+c.dias_vencido || 0) > 0);
  else if (f === 'pag') l = l.filter(c => (+c.pendiente || 0) < 1);
  if (q) l = l.filter(c => norm(c.cliente + ' ' + c.numero).includes(q));
  l.sort((a, b) => f === 'pag' ? fecha10(b.fecha_emision).localeCompare(fecha10(a.fecha_emision)) : ((+b.pendiente || 0) - (+a.pendiente || 0)));
  const tot = l.reduce((a, c) => a + ((+c.pendiente || 0) >= 1 ? +c.pendiente : 0), 0);
  return `${selectorVendedor()}<h2>Cobranza</h2>
  <div class="chips">${[['saldo','Con saldo'],['venc','Vencidos'],['pag','Pagados'],['todo','Todos']].map(([k, n]) => `<button class="${f === k ? 'on' : ''}" onclick="S.filtroCob='${k}';pintar()">${n}</button>`).join('')}</div>
  <input class="in" placeholder="Buscar cliente o folio" value="${esc(S.qCob || '')}" oninput="S.qCob=this.value;clearTimeout(window._qb);window._qb=setTimeout(()=>{pintar();const i=document.querySelector('main .in');i.focus();i.setSelectionRange(i.value.length,i.value.length)},350)">
  <div class="sub" style="margin:8px 2px">${l.length} documentos${tot ? ' · deben ' + $$(tot) : ''}</div>
  <div class="card">${l.length ? l.slice(0, 250).map(c => { const p = +c.pendiente || 0, v = verificandoDe(c.id);
    return `<div class="row" onclick="${p >= 1 ? `abrirPago('${esc(c.id)}')` : `abrirCliente(${esc(JSON.stringify(c.cliente))})`}"><div class="m"><b>${esc(c.cliente)}</b><span>${esc(c.tipo || '')} ${esc(c.numero)} · ${fmtF(c.fecha_emision)} · total ${$0(c.total)}${(+c.dias_vencido || 0) > 0 && p >= 1 ? ' · ' + (+c.dias_vencido) + ' días vencido' : ''}</span></div>
      <div class="r">${p >= 1 ? '<b>' + $$(p) + '</b>' + (v ? '<span class="tag t-warn">' + $0(v) + ' por verificar</span>' : '<span>💵 registrar pago</span>') : '<span class="tag t-ok">pagado</span>'}</div></div>`; }).join('') : '<div class="vacio">Nada en esta vista</div>'}</div>`;
}
// v2.0.1 — Pagos recibidos y comisión por mes (como "Ingresos" y "Mi Comisión" de la app anterior)
function vPagos(){
  const v = miVendedor(), pct = PCT_COMISION[v] || 0;
  const numsMios = new Set(filtroMios(cobrosVivos()).map(c => String(c.numero).trim()));
  const todos = ingresosValidos().filter(i => numsMios.has(String(i.factura).trim()));
  const meses = [...new Set(todos.map(i => fecha10(i.fecha).slice(0, 7)).concat([mesActual()]))].sort().reverse().slice(0, 12);
  const mes = S.mesPagos || mesActual();
  const l = todos.filter(i => fecha10(i.fecha).slice(0, 7) === mes).sort((a, b) => fecha10(b.fecha).localeCompare(fecha10(a.fecha)));
  const tot = l.reduce((a, i) => a + (+i.monto || 0), 0);
  const nm = m => MESES[+m.slice(5) - 1] + ' ' + m.slice(2, 4);
  return `${selectorVendedor()}<h2>Pagos y comisión</h2>
  <div class="chips">${meses.map(m => `<button class="${m === mes ? 'on' : ''}" onclick="S.mesPagos='${m}';pintar()">${nm(m)}</button>`).join('')}</div>
  <div class="kpis"><div class="kpi"><small>Cobrado en ${nm(mes)}</small><b>${$0(tot)}</b><span>${l.length} pagos</span></div>
    <div class="kpi"><small>Comisión aprox.</small><b>${pct ? $0(tot * pct) : '—'}</b><span>${pct ? Math.round(pct * 100) + '% de lo cobrado' : 'la calcula Rafa'}</span></div></div>
  <div class="sub" style="margin:2px 0 10px">Aproximada: Rafa la confirma al cierre del mes.</div>
  <div class="card">${l.length ? l.map(i => `<div class="row" onclick="abrirCliente(${esc(JSON.stringify(i.cliente))})"><div class="m"><b>${esc(i.cliente)}</b><span>${esc(i.factura || '')} · ${esc(i.cuenta || '')} · ${fmtF(i.fecha)}</span></div><div class="r"><b>${$$(i.monto)}</b>${pct ? '<span>comisión ' + $$(r2((+i.monto || 0) * pct)) + '</span>' : ''}</div></div>`).join('') : '<div class="vacio">Sin pagos en este mes</div>'}</div>`;
}

function vPedidos(){
  const f = S.filtroPed;
  const cots = filtroMios(S.d.cotizaciones || []).map(c => ({ k: 'c', d: c }));
  const peds = filtroMios((S.d.pedidos || []).filter(p => !/borrador|duplicad/i.test(p.estatus || ''))).map(p => ({ k: 'p', d: p }));
  const facs = filtroMios(S.d.facturas || []).map(d => ({ k: 'f', d })), rems = filtroMios(S.d.remisiones || []).map(d => ({ k: 'r', d }));
  let l = f === 'cot' ? cots : f === 'ped' ? peds : f === 'fac' ? facs : f === 'rem' ? rems : f === 'pend' ? cots.filter(x => x.d.estatus === 'enviada') : cots.filter(x => x.d.estatus !== 'convertida').concat(peds);
  const q = norm(S.qPed || ''); if (q) l = l.filter(x => norm(x.d.cliente + ' ' + x.d.folio).includes(q));
  l.sort((a, b) => fecha10(b.d.fecha).localeCompare(fecha10(a.d.fecha)) || String(b.d.folio).localeCompare(String(a.d.folio)));
  return `${selectorVendedor()}<h2>Cotizaciones y pedidos</h2>
  <div class="chips">${[['todo','Todo'],['pend','Por confirmar'],['cot','Cotizaciones'],['ped','Pedidos'],['fac','Facturas'],['rem','Remisiones']].map(([k, n]) => `<button class="${f === k ? 'on' : ''}" onclick="S.filtroPed='${k}';pintar()">${n}</button>`).join('')}</div>
  <input class="in" placeholder="Buscar cliente o folio" value="${esc(S.qPed || '')}" oninput="S.qPed=this.value;clearTimeout(window._qp);window._qp=setTimeout(()=>{pintar();const i=document.querySelector('main .in');i.focus();i.setSelectionRange(i.value.length,i.value.length)},350)">
  <div class="card" style="margin-top:10px">${l.length ? l.slice(0, 200).map(x => x.k === 'c' ? filaCot(x.d) : x.k === 'p' ? `<div class="row" onclick="abrirDoc('pedidos','${esc(x.d.id)}')"><div class="m"><b>${esc(x.d.cliente)}</b><span>Pedido ${esc(x.d.folio)} · ${fmtF(x.d.fecha)}</span></div><div class="r"><b>${$$(x.d.total)}</b>${estadoPed(x.d)}</div></div>` : filaDoc(x.k === 'f' ? 'facturas' : 'remisiones', x.d)).join('') : '<div class="vacio">No hay nada aquí todavía</div>'}</div>`;

function saldoCliente(nombre){ const n = norm(nombre); return cobrosVivos().filter(c => norm(c.cliente) === n).reduce((a, c) => a + ((+c.pendiente || 0) >= 1 ? +c.pendiente : 0), 0); }
function vClientes(){
  const q = norm(S.qCli || '');
  let l = misClientes().filter(c => vivo(c) && c.activo !== false && c.activo !== 'false').map(c => ({ c, s: saldoCliente(c.razon_social) }));
  if (q) l = l.filter(x => norm(x.c.razon_social + ' ' + (x.c.nombre_comercial || '') + ' ' + (x.c.telefono || '')).includes(q));

  <input class="in" placeholder="Buscar cliente" value="${esc(S.qCli || '')}" oninput="S.qCli=this.value;clearTimeout(window._qc);window._qc=setTimeout(()=>{pintar();const i=document.querySelector('main .in');i.focus();i.setSelectionRange(i.value.length,i.value.length)},350)">
  <div class="card" style="margin-top:10px">${l.length ? l.slice(0, 200).map(x => `<div class="row" onclick="abrirCliente(${esc(JSON.stringify(x.c.razon_social))})"><div class="m"><b>${esc(x.c.razon_social)}</b><span>${esc(x.c.ciudad || x.c.telefono || '')}${x.c.vendedor && !esVendedor() ? ' · ' + esc(x.c.vendedor) : ''}</span></div><div class="r">${x.s >= 1 ? '<b>' + $$(x.s) + '</b><span>debe</span>' : '<span class="tag t-ok">al corriente</span>'}</div></div>`).join('') : '<div class="vacio">No hay clientes' + (q ? ' con esa búsqueda' : '') + '</div>'}</div>`;
}

function disponible(p){ return Math.max(0, (+p.stock_actual || 0) - (+p.stock_comprometido || 0)); }
// v2.1.9 — los carry on (RL0xxCO…, categoría CARRY ON) se venden por SET de 6 piezas: el inventario sigue en piezas, la app lo muestra en sets
const CARRY_CAJA = false; // v2.1.16 (Rafa 11 nov: por pieza está mejor) — true = carry on por caja de 6
function pzSet(p){ return CARRY_CAJA && p && (String(p.categoria || '').toUpperCase() === 'CARRY ON' || /^RL\d{3}CO/i.test(String(p.sku || ''))) ? 6 : 1; }
function esSet3(p){ return String(p && p.unidad || '').toLowerCase() === 'juego' || /^SET /i.test(String(p && p.categoria || '')); } // maletas que ya se manejan por set de 3
function dispTxt(p){ const d = disponible(p), k = pzSet(p); return k > 1 ? Math.floor(d / k) + ' cajas (' + d + ' pz)' : d + (esSet3(p) ? ' sets de 3 pz' : ' disponibles'); }
function vCatalogo(){
  const q = norm(S.qCat || '');
  let l = (S.d.productos || []).filter(p => p.activo !== false && p.activo !== 'false');
  if (q) l = l.filter(p => norm(p.sku + ' ' + p.descripcion).includes(q));
  if (S.soloExist) l = l.filter(p => disponible(p) > 0);
  l.sort((a, b) => disponible(b) - disponible(a) || String(a.sku).localeCompare(String(b.sku)));
  return `<h2>Inventario</h2>
  <div class="chips"><button class="${!S.soloExist ? 'on' : ''}" onclick="S.soloExist=false;pintar()">Todos</button><button class="${S.soloExist ? 'on' : ''}" onclick="S.soloExist=true;pintar()">Con existencia</button></div>
  <input class="in" placeholder="Buscar modelo o descripción" value="${esc(S.qCat || '')}" oninput="S.qCat=this.value;clearTimeout(window._qk);window._qk=setTimeout(()=>{pintar();const i=document.querySelector('main .in');i.focus();i.setSelectionRange(i.value.length,i.value.length)},350)">
  <div class="sub" style="margin:8px 2px">Disponible = existencia menos lo apartado en cotizaciones. Solo se lleva inventario de la mercancía nueva.</div>
  <div class="card">${l.length ? l.slice(0, 300).map(p => { const d = disponible(p); return `<div class="row" style="cursor:default"><div class="m"><b>${esc(p.sku)}</b><span>${esc(p.descripcion || '')}</span></div><div class="r"><b>${pzSet(p) > 1 ? Math.floor(d / pzSet(p)) + ' cajas' : d + (esSet3(p) ? ' sets' : ' pzs')}</b><span>${pzSet(p) > 1 ? d + ' pz · ' : ''}${(+p.stock_comprometido || 0) ? (+p.stock_comprometido) + ' apartadas · ' : ''}${+p.precio ? 'lista ' + $0(p.precio * pzSet(p)) + (pzSet(p) > 1 ? ' la caja' : '') : ''}</span></div></div>`; }).join('') : '<div class="vacio">Sin productos</div>'}</div>`;
}

// ---------- hojas (detalle) ----------
function hoja(titulo, html){ cerrarHoja(); const h = document.createElement('div'); h.className = 'hoja'; h.id = 'hoja'; h.onclick = e => { if (e.target === h) cerrarHoja(); };
  h.innerHTML = `<div><div class="cab"><b>${titulo}</b><button class="x" onclick="cerrarHoja()">✕</button></div><div id="hojaC">${html}</div></div>`; document.body.appendChild(h); }
function cerrarHoja(){ const h = $('hoja'); if (h) h.remove(); }

function enviosUsados(){ const m = new Map(); ['cotizaciones','pedidos','remisiones','facturas'].forEach(t => (S.d[t] || []).forEach(d => { const v = String(d.envio || '').trim(); if (v) m.set(v.toUpperCase(), v); })); return [...m.values()].sort().slice(0, 40); }

// v2.1.6 — 💬 Enviar por WhatsApp: el vendedor elige qué manda (PDF, XML, mensaje). Los archivos se preparan al abrir la hoja
// (el teléfono solo deja compartir justo después de tocar un botón), luego se comparten y en el menú se elige WhatsApp.
const LIB_PDF = 'https://cdnjs.cloudflare.com/ajax/libs/html2pdf.js/0.10.1/html2pdf.bundle.min.js';
const LIB_QR = 'https://cdnjs.cloudflare.com/ajax/libs/qrcode-generator/1.4.4/qrcode.min.js';
const NOMBRE_DOC = { cotizaciones: 'Cotizacion', pedidos: 'Pedido', facturas: 'Factura', remisiones: 'Remision' };
function scriptEn(doc, src){ return new Promise((ok, mal) => { const s = doc.createElement('script'); s.src = src; s.onload = ok; s.onerror = () => mal(new Error('no cargó ' + src.split('/').pop())); doc.head.appendChild(s); }); }
function htmlDoc(tabla, id){ // el mismo PDF del ERP (imprimirDocumento), pero como texto en vez de abrir una ventana
  let html = ''; const oO = window.open, oC = URL.createObjectURL;
  window.open = () => ({ document: { write: x => { html += x; }, close(){} }, print(){}, closed: false }); URL.createObjectURL = undefined;
  try { imprimirDocumento(tabla, id); } finally { window.open = oO; URL.createObjectURL = oC; }
  return html;
}
async function pdfArchivo(tabla, id){
  const d = (S.d[tabla] || []).find(x => String(x.id) === String(id)); if (!d) throw new Error('No encontré el documento');
  if (typeof imprimirDocumento !== 'function') throw new Error('No se pudo cargar el PDF');
  if (tabla === 'facturas' && d.uuid_sat && !cfdiGetTimbres()[d.uuid_sat]) await xmlDe(d.uuid_sat);
  const html = htmlDoc(tabla, id);
  const f = document.createElement('iframe'); f.setAttribute('aria-hidden', 'true');
  f.style.cssText = 'position:fixed;left:-10000px;top:0;width:710px;height:1000px;border:0;background:#fff';
  document.body.appendChild(f);
  try {
    await new Promise(ok => { f.onload = ok; f.srcdoc = html; });
    const w = f.contentWindow, doc = f.contentDocument;
    await scriptEn(doc, LIB_PDF);
    const qr = doc.querySelector('img[alt="QR SAT"]'); // el QR se dibuja aquí mismo (la imagen de internet no se deja copiar al PDF)
    if (qr) { try { await scriptEn(doc, LIB_QR); const q = w.qrcode(0, 'M'); q.addData(new URL(qr.src).searchParams.get('data')); q.make(); qr.src = q.createDataURL(4, 0); } catch(e){} }
    doc.querySelectorAll('svg').forEach(sv => { // el logo (SVG) como imagen: así sale igual que en el ERP (dibujado directo pierde los huecos)
      if (!sv.getAttribute('xmlns')) sv.setAttribute('xmlns', 'http://www.w3.org/2000/svg');
      const r = sv.getBoundingClientRect(), im = doc.createElement('img');
      sv.setAttribute('width', Math.round(r.width)); sv.setAttribute('height', Math.round(r.height)); // tamaño propio de la imagen = el que tiene en la hoja
      im.className = sv.getAttribute('class') || ''; im.style.cssText = (sv.getAttribute('style') || '') + ';width:' + r.width + 'px;height:' + r.height + 'px';
      im.src = 'data:image/svg+xml;charset=utf-8,' + encodeURIComponent(new XMLSerializer().serializeToString(sv)); sv.replaceWith(im);
    });
    await Promise.all(Array.from(doc.images).map(i => i.complete ? 0 : new Promise(z => { i.onload = i.onerror = z; })));
    const op = w.JSON.parse(JSON.stringify({ margin: [12, 14, 12, 14], image: { type: 'jpeg', quality: 0.95 }, html2canvas: { scale: 2, useCORS: true, backgroundColor: '#ffffff' },
      jsPDF: { unit: 'mm', format: 'letter', orientation: 'portrait' }, pagebreak: { mode: ['css', 'legacy'] } })); // opciones creadas dentro del iframe (html2pdf revisa "instanceof Array")
    const blob = await w.html2pdf().set(op).from(doc.body).outputPdf('blob');
    return new File([blob], (NOMBRE_DOC[tabla] || 'Documento') + '_' + String(d.folio || id).replace(/[^\w-]/g, '') + '.pdf', { type: 'application/pdf' });
  } finally { f.remove(); }
}

async function enviarWAYa(tabla, id){
  const prep = WA[tabla + ':' + id] || {};
  const quiere = k => { const e = $('wa_' + k); return !!(e && e.checked); };
  const texto = quiere('txt') ? textoDoc(tabla, id) : '';
  if (quiere('pdf') && !prep.pdf) { toast(prep.err ? 'No se pudo hacer el PDF' : 'Espera, el PDF todavía se está preparando…', !!prep.err); return; }
  if (quiere('xml') && !prep.xml) { toast('Espera, el XML todavía se está preparando…'); return; }
  const xml = quiere('xml') ? prep.xml : null;
  const files = [quiere('pdf') && prep.pdf].filter(Boolean); // v2.1.7: Chrome en Android NO deja compartir .xml ("Permission denied"); el XML se guarda en Descargas
  if (!files.length && !texto && !xml) { toast('Elige qué quieres enviar', true); return; }
  const d = (S.d[tabla] || []).find(x => String(x.id) === String(id)) || {};
  const avisoXml = () => { if (xml) { bajar(xml); toast('El XML se guardó en Descargas: en WhatsApp tócale 📎 → Documento y elige ' + xml.name); } };
  if (!files.length) { avisoXml(); window.open('https://wa.me/' + telCliente(d.cliente) + (texto ? '?text=' + encodeURIComponent(texto) : ''), '_blank'); return; }
  if (navigator.canShare && navigator.canShare({ files })) {
    avisoXml(); // primero se guarda el XML (no gasta el permiso de compartir), luego se comparte el PDF
    try { await navigator.share(texto ? { files, text: texto } : { files }); cerrarHoja(); }
    catch(e) { if (!e || e.name !== 'AbortError') { toast('No se pudo compartir: ' + (e && e.message || e), true); } }
    return;
  }
  // computadora: se bajan los archivos y se abre WhatsApp con el mensaje para adjuntarlos
  files.forEach(bajar); if (xml) bajar(xml);
  toast('Se bajaron los archivos: adjúntalos en WhatsApp');
  window.open('https://wa.me/' + telCliente(d.cliente) + (texto ? '?text=' + encodeURIComponent(texto) : ''), '_blank');
}

// v2.1.15 (Rafa 11 nov) — foto del comprobante: se achica (JPEG ≤1600 px) y se sube ligada a SU pago reportado; Rafa la ve al verificar
function leerArchivo(b){ return new Promise((ok, mal) => { const r = new FileReader(); r.onload = () => ok(String(r.result)); r.onerror = () => mal(r.error); r.readAsDataURL(b); }); }
async function prepararFoto(f){
  if (/^image\//.test(f.type || '') && !/heic|heif/i.test(f.type || '')) {
    try { const url = URL.createObjectURL(f); const img = await new Promise((ok, mal) => { const i = new Image(); i.onload = () => ok(i); i.onerror = mal; i.src = url; });
      const k = Math.min(1, 1600 / Math.max(img.naturalWidth || 1, img.naturalHeight || 1)), cv = document.createElement('canvas');
      cv.width = Math.max(1, Math.round(img.naturalWidth * k)); cv.height = Math.max(1, Math.round(img.naturalHeight * k)); cv.getContext('2d').drawImage(img, 0, 0, cv.width, cv.height); URL.revokeObjectURL(url);
      const d = cv.toDataURL('image/jpeg', 0.82); if (/^data:image\/jpeg;base64,/.test(d) && d.length > 100) return { mime: 'image/jpeg', datos: d.split(',')[1], nombre: String(f.name || 'comprobante').replace(/\.[^.]+$/, '') + '.jpg' };
    } catch(e){}
  }
  const d = await leerArchivo(f); return { mime: /pdf/i.test(f.type || f.name || '') ? 'application/pdf' : (f.type || 'image/jpeg'), datos: d.split(',')[1] || '', nombre: f.name || 'comprobante' };
}

}

  const btn = $('pgBtn'); btn.disabled = true; btn.textContent = 'Enviando…';
  const id = btn.dataset.id || ('pv_' + Date.now() + '_' + Math.random().toString(36).slice(2, 6)); btn.dataset.id = id; // reintento = mismo id
  const item = { id, fecha: $('pgFecha').value, creado: new Date().toISOString(), cliente: c.cliente, cobro_id: c.id, documento: (c.tipo ? c.tipo + ' ' : '') + c.numero,
    monto, cuenta: $('pgCuenta').value, forma: $('pgForma').value, referencia: $('pgRef').value.trim(), notas: $('pgNotas').value.trim() };
  const foto = ($('pgFoto') || {}).files && $('pgFoto').files[0]; if (foto) item.con_comprobante = true; // v2.1.15 el aviso a Rafa dice que trae foto
  try {
    const j = await api({ accion: 'erp_crear', tabla: 'pagosverificar', item });
    if (!j.ok && !j.ya_existia) throw new Error(j.error || 'no se guardó');
    if (foto) { btn.textContent = 'Subiendo foto…';
      const e = await subirComprobante(id, foto);
      if (e) { toast('✓ Pago reportado, pero la foto no se subió (' + e + '). Toca otra vez para subirla.', true); btn.disabled = false; btn.textContent = 'Subir la foto otra vez'; return; } }
    toast('✓ Pago reportado' + (foto ? ' con su comprobante' : '') + ': queda por verificar'); cerrarHoja(); cargar(true);
  } catch(e){ toast('✗ ' + e.message + ' · puedes reintentar, no se duplica', true); btn.disabled = false; btn.textContent = 'Reportar pago'; }
}

// ---------- cotizar ----------
S.cot = { cliente: '', lineas: [], conIva: false, notas: '', nuevo: false, tel: '', envio: '' }; // v2.1.9: sin IVA predeterminado (Rafa)
function vCotizar(){
  if (!puedeCotizar()) return '<h2>Cotizar</h2><div class="card vacio">Tu usuario todavía no puede subir cotizaciones.<br>Pídeselo a Rafa.</div>';
  const C = S.cot, its = C.lineas.map(l => ({ cantidad: l.cantidad, precio_unitario: l.precio })), t = calcDoc(its, !C.conIva);
  return `<h2>Nueva cotización</h2>
  <div class="card">
    <label class="l" style="margin-top:0">Cliente</label>
    ${C.cliente && !C.nuevo ? `<div style="display:flex;gap:8px;align-items:center"><b style="flex:1">${esc(C.cliente)}</b><button class="btn s" onclick="S.cot.cliente='';pintar()">Cambiar</button></div>`
      : `<input id="ctCli" class="in" placeholder="Buscar cliente" value="${esc(C.nuevo ? C.cliente : (S.qCtCli || ''))}" oninput="${C.nuevo ? 'S.cot.cliente=this.value' : 'S.qCtCli=this.value;buscarCli()'}" autocomplete="off">
         ${C.nuevo ? `<input class="in" style="margin-top:6px" placeholder="Teléfono (opcional)" inputmode="tel" value="${esc(C.tel)}" oninput="S.cot.tel=this.value"><div class="sub" style="margin-top:6px">Cliente nuevo: queda a tu nombre. <a href="#" onclick="S.cot.nuevo=false;S.cot.cliente='';pintar();return false">Buscar uno que ya existe</a></div>`
           : `<div id="ctCliRes"></div><div class="sub" style="margin-top:6px"><a href="#" onclick="S.cot.nuevo=true;S.cot.cliente=S.qCtCli||'';pintar();return false">＋ Es un cliente nuevo</a></div>`}`}
  </div>
  <div class="card">
    <label class="l" style="margin-top:0">Productos</label>
    ${C.lineas.map((l, i) => `<div class="linea"><b>${esc(l.sku)}</b> <small>${esc(l.desc || '')} · ${(l.ps || 1) > 1 ? Math.floor(l.disp / l.ps) + ' cajas (' + l.disp + ' pz)' : l.disp + (l.s3 ? ' sets' : '')} disponibles</small>
      ${(l.ps || 1) > 1 ? `<div class="sub" style="margin:4px 0 0">📦 Por caja de ${l.ps} pz${+l.precio ? ' · pieza ' + $$(r2(l.precio / l.ps)) : ''}</div>` : ''}
      <div class="li"><label>${(l.ps || 1) > 1 && l.modo !== 'pz' ? 'Cajas' : 'Cantidad'}<input class="in" type="number" inputmode="numeric" min="1" value="${l.cantidad}" oninput="S.cot.lineas[${i}].cantidad=+this.value;totCot()"></label>
      <label>Precio ${(l.ps || 1) > 1 && l.modo !== 'pz' ? 'por caja' : 'c/u'}${C.conIva ? ' sin IVA' : ''}<input class="in" type="number" inputmode="decimal" step="0.01" placeholder="$" value="${l.precio || ''}" oninput="S.cot.lineas[${i}].precio=+this.value;totCot()"></label>
      <button class="x" onclick="S.cot.lineas.splice(${i},1);pintar()">✕</button></div></div>`).join('')}
    <label class="l">Toca un producto para agregarlo · solo los que hay en inventario</label>
    <input id="ctProd" class="in" placeholder="🔎 Buscar modelo o color" value="${esc(S.qProd || '')}" oninput="S.qProd=this.value;buscarProd()" autocomplete="off"><div id="ctProdRes">${htmlProds()}</div>
    <label class="sw"><input type="checkbox" ${C.conIva ? 'checked' : ''} onchange="S.cot.conIva=this.checked;pintar()"> Con factura (+16% IVA)</label>
    <label class="l">🚚 Envío: ¿por dónde se manda? (opcional)</label><input class="in" list="ctEnvioLista" placeholder="Fletera, paquetería o recoge en bodega" value="${esc(C.envio || '')}" oninput="S.cot.envio=this.value" autocomplete="off"><datalist id="ctEnvioLista">${enviosUsados().map(x => `<option value="${esc(x)}">`).join('')}</datalist>
    <label class="l">Notas (opcional)</label><input class="in" value="${esc(C.notas)}" oninput="S.cot.notas=this.value">
  </div>
  <div class="card" id="ctTot">${htmlTot(t)}</div>
  <button class="btn p w" id="ctBtn" onclick="subirCot()">Subir cotización</button>
  <div class="sub" style="margin-top:8px;text-align:center">Rafa o Yazmín la confirman y se vuelve pedido.</div>`;
}
function htmlTot(t){ return `<div class="tot"><span>Subtotal</span><span>${$$(t.subtotal)}</span></div><div class="tot"><span>IVA</span><span>${$$(t.iva)}</span></div><div class="tot g"><span>Total</span><span>${$$(t.total)}</span></div>`; }
function totCot(){ const C = S.cot; $('ctTot').innerHTML = htmlTot(calcDoc(C.lineas.map(l => ({ cantidad: l.cantidad, precio_unitario: l.precio })), !C.conIva)); }
function buscarCli(){
  const q = norm(S.qCtCli || ''), box = $('ctCliRes'); if (!box) return;
  if (q.length < 2) { box.innerHTML = ''; return; }
  const l = misClientes().filter(c => norm(c.razon_social + ' ' + (c.nombre_comercial || '')).includes(q)).slice(0, 12);
  box.innerHTML = l.length ? '<div class="res">' + l.map(c => `<div onclick="S.cot.cliente=${esc(JSON.stringify(c.razon_social))};S.cot.nuevo=false;pintar()"><b>${esc(c.razon_social)}</b>${c.ciudad ? '<div class="sub">' + esc(c.ciudad) + '</div>' : ''}</div>`).join('') + '</div>' : '<div class="sub" style="margin-top:6px">No encontré ese cliente.</div>';
}
// v2.1.8 — Cotizar: la lista completa del inventario a la vista (solo con existencias) y se agrega con un toque.
// Las piezas INDIVIDUALES (clave que empieza con Z o dice INDIVIDUAL) no se cotizan: solo sirven para facturar.
function esIndividual(p){ return /^Z/i.test(String(p.sku || '').trim()) || /INDIVIDUAL/i.test(String(p.descripcion || '')); }
function prodsCotizables(){ return (S.d.productos || []).filter(p => p.activo !== false && p.activo !== 'false' && !esIndividual(p) && disponible(p) > 0).sort((a, b) => String(a.sku).localeCompare(String(b.sku))); }
function htmlProds(){
  const q = norm(S.qProd || ''), todos = prodsCotizables(), l = q ? todos.filter(p => norm(p.sku + ' ' + p.descripcion).includes(q)) : todos;
  if (!todos.length) return '<div class="sub" style="margin-top:6px">' + ((S.d.productos || []).length ? 'No hay productos con inventario.' : 'Cargando inventario…') + '</div>';
  const en = sku => { const x = S.cot.lineas.find(l => l.sku === sku); return x ? x.cantidad : 0; };
  return '<div class="res" style="max-height:340px">' + (l.map(p => `<div onclick="agregarProd(${esc(JSON.stringify(p.sku))})" style="display:flex;gap:10px;align-items:center"><div style="flex:1;min-width:0"><b>${esc(p.sku)}</b> <span class="sub">${dispTxt(p)}${+p.precio ? ' · lista ' + $0((S.cot.conIva && +p.precio_factura ? p.precio_factura : p.precio) * pzSet(p)) + (pzSet(p) > 1 ? ' la caja' : '') : ''}</span><div class="sub">${esc(p.descripcion || '')}</div></div>${en(p.sku) ? `<b style="white-space:nowrap">✓ ${en(p.sku)}</b>` : '<span style="font-size:20px;opacity:.6">＋</span>'}</div>`).join('') || '<div class="sub">Sin resultados</div>') + '</div>';
}
function buscarProd(){ const box = $('ctProdRes'); if (box) box.innerHTML = htmlProds(); }
function agregarProd(sku){
  const p = (S.d.productos || []).find(x => x.sku === sku); if (!p) return;
  const ya = S.cot.lineas.find(l => l.sku === sku);
  if (ya) ya.cantidad += 1;
  else { const k = pzSet(p); S.cot.lineas.push({ sku, desc: p.descripcion || '', cantidad: 1, precio: r2((+(S.cot.conIva && +p.precio_factura ? p.precio_factura : p.precio) || 0) * k), disp: disponible(p), ps: k, modo: k > 1 ? 'set' : 'pz', s3: esSet3(p) }); }
  const r = document.querySelector('#ctProdRes .res'), top = r ? r.scrollTop : 0, y = window.scrollY; // la lista se queda donde estaba
  pintar(); const rr = document.querySelector('#ctProdRes .res'); if (rr) rr.scrollTop = top; window.scrollTo(0, y);
  toast('✓ ' + sku + ' agregado');
}
function modoLinea(i, modo){ // el vendedor puede partir el set en piezas (o regresarlo a sets)
  const l = S.cot.lineas[i]; if (!l || (l.ps || 1) < 2 || (l.modo || 'pz') === modo) return;
  if (modo === 'pz') { l.cantidad = (+l.cantidad || 0) * l.ps; l.precio = r2((+l.precio || 0) / l.ps); }
  else { l.cantidad = Math.max(1, Math.round((+l.cantidad || 0) / l.ps)); l.precio = r2((+l.precio || 0) * l.ps); }
  l.modo = modo; pintar();
}
const pzLinea = l => (l.ps || 1) > 1 && l.modo !== 'pz' ? (+l.cantidad || 0) * l.ps : (+l.cantidad || 0);
async function subirCot(){
  const C = S.cot, cliente = String(C.cliente || '').trim();
  if (!cliente) { toast('Falta el cliente', true); return; }
  if (!C.lineas.length) { toast('Agrega al menos un producto', true); return; }
  const mal = C.lineas.find(l => !(+l.cantidad > 0) || !(+l.precio > 0)); if (mal) { toast('Revisa cantidad y precio de ' + mal.sku + ' (deben ser mayores a 0)', true); return; }
  const sinExist = C.lineas.filter(l => pzLinea(l) > l.disp);
  if (sinExist.length && !confirm('No hay suficientes piezas disponibles de: ' + sinExist.map(l => l.sku + ' (' + ((l.ps || 1) > 1 ? Math.floor(l.disp / l.ps) + ' cajas' : l.disp) + ')').join(', ') + '. ¿Subirla de todos modos?')) return;
  const btn = $('ctBtn'); btn.disabled = true; btn.textContent = 'Subiendo…';
  C.id = C.id || ('app_cot_' + Date.now() + '_' + Math.random().toString(36).slice(2, 6)); // reintento = mismo id, no se duplica
  try {
    if (C.nuevo && !(S.d.clientes || []).some(c => norm(c.razon_social) === norm(cliente))) {
      const jc = await api({ accion: 'erp_crear', tabla: 'clientes', item: { id: 'cli_app_' + C.id, razon_social: cliente.toUpperCase(), telefono: C.tel || '', activo: true, fecha_alta: hoy(), notas: 'Alta desde la app de vendedores' } });
      if (!jc.ok && !jc.ya_existia) throw new Error(jc.error || 'no se dio de alta el cliente');
    }
    const items = C.lineas.map(l => { const set = (l.ps || 1) > 1 && l.modo !== 'pz'; // se guarda en piezas (inventario y apartado van en piezas); la descripción dice los sets
      const x = { sku: l.sku, descripcion: (l.desc || l.sku) + (set ? ' · ' + (+l.cantidad) + (+l.cantidad === 1 ? ' caja' : ' cajas') + ' de ' + l.ps + ' pz' : ''), cantidad: pzLinea(l),
        precio_unitario: set ? Math.round((+l.precio) / l.ps * 10000) / 10000 : +l.precio, descuento_pct: 0, iva_pct: C.conIva ? 16 : 0 };
      if (set) x.pz_caja = l.ps; // v2.1.14 el PDF lo muestra por caja (cantidad en cajas, precio de la caja)
      return x; });
    const t = calcDoc(items, !C.conIva);
    const item = { id: C.id, folio: '', fecha: hoy(), cliente: C.nuevo ? cliente.toUpperCase() : cliente, subtotal: t.subtotal, iva: t.iva, total: t.total, sin_iva: !C.conIva,
      envio: String(C.envio || '').trim(), items_json: JSON.stringify(items), notas: (C.notas ? C.notas + ' · ' : '') + (C.conIva ? '' : 'SIN IVA · ') + 'Cotización desde la app de vendedores' };
    const j = await api({ accion: 'erp_crear', tabla: 'cotizaciones', item });
    if (!j.ok && !j.ya_existia) throw new Error(j.error || 'no se guardó');
    const folio = (j.item && j.item.folio) || '';
    S.cot = { cliente: '', lineas: [], conIva: false, notas: '', nuevo: false, tel: '', envio: '' }; S.qCtCli = '';
    toast('✓ Cotización ' + folio + ' subida · Rafa o Yazmín la confirman');
    S.tab = 'pedidos'; S.filtroPed = 'pend'; await cargar(true);
    const nueva = (S.d.cotizaciones || []).find(x => String(x.id) === String(item.id)); if (nueva) abrirDoc('cotizaciones', nueva.id);
  } catch(e){ toast('✗ No se subió: ' + e.message + ' · puedes reintentar, no se duplica', true); btn.disabled = false; btn.textContent = 'Subir cotización'; }
}

// ---------- arranque ----------
function arrancar(){
  TABLAS.forEach(t => S.d[t] = lsGet(K_CACHE + t, [])); S.d.empresa = lsGet(K_CACHE + 'empresa', null) || undefined;
  marco(); pintar(); cargar(true);
}
window.addEventListener('load', () => {
  if ('serviceWorker' in navigator) { try { navigator.serviceWorker.register('sw.js', { scope: './' }); } catch(e){} }
  S.ses = lsGet(K_SES, null);
  if (S.ses && S.ses.codigo) arrancar(); else pintarLogin();
});
document.addEventListener('visibilitychange', () => { if (document.visibilityState === 'visible' && S.ses && (!S.hora || Date.now() - S.hora > 5 * 60 * 1000)) cargar(true); });
</script>
</body>
